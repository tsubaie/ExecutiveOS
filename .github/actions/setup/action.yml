name: Setup
description: pnpm, Node and installed dependencies, shared by every CI job.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.30.3
    - uses: actions/setup-node@v4
      with:
        # 22.12.0 segfaults when the argon2 binding loads; 22.14+ is fine (see docs/history).
        node-version: 22.23.2
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
